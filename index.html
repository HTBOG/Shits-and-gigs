<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triple Threat Casino</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <header>
            <h1>🎰 TRIPLE THREAT 🎲</h1>
            <div class="header-info">
                <div class="credits-display">
                    <span>$</span>
                    <span id="credits">1000</span>
                </div>
                <div class="music-controls">
                    <button id="music-toggle" class="music-btn">🔊</button>
                    <input type="range" id="volume-slider" min="0" max="100" value="50" class="volume-slider">
                </div>
            </div>
        </header>

        <div class="games-wrapper">
            <!-- GAME 1: SLOTS -->
            <div id="slots-section" class="game-section active">
                <div class="section-header">
                    <h2>🎰 SLOTS</h2>
                    <span class="section-status" id="slots-status">SPIN TO START!</span>
                </div>

                <div class="slot-machine">
                    <div class="machine-frame">
                        <div class="reels-container">
                            <div class="reel" id="reel1">
                                <div class="symbols"></div>
                            </div>
                            <div class="reel" id="reel2">
                                <div class="symbols"></div>
                            </div>
                            <div class="reel" id="reel3">
                                <div class="symbols"></div>
                            </div>
                        </div>
                        <div class="win-line"></div>
                    </div>
                </div>

                <div class="controls">
                    <div class="bet-controls">
                        <button id="bet-down" class="bet-btn">-</button>
                        <div class="bet-display">
                            <span>BET:</span>
                            <span id="bet-amount">10</span>
                        </div>
                        <button id="bet-up" class="bet-btn">+</button>
                    </div>
                    <button id="spin-btn" class="spin-button">SPIN</button>
                    <button id="max-bet-btn" class="max-bet-button">MAX BET</button>
                </div>

                <div class="slots-info">
                    <div class="paytable-mini">
                        <span>💎💎💎 = 5 balls</span>
                        <span>7️⃣7️⃣7️⃣ = 4 balls</span>
                        <span>Any 3 = 3 balls</span>
                        <span>Any 2 = 2 balls</span>
                    </div>
                </div>
            </div>

            <!-- Arrow connector -->
            <div class="connector">
                <div class="arrow-down">▼</div>
                <div class="balls-earned" id="balls-earned-display">0 balls</div>
            </div>

            <!-- GAME 2: PLINKO -->
            <div id="plinko-section" class="game-section">
                <div class="section-header">
                    <h2>🔴 PLINKO</h2>
                    <span class="section-status" id="plinko-status">Waiting for slots...</span>
                </div>

                <div class="plinko-info">
                    <span>Balls: <strong id="balls-remaining">0</strong></span>
                </div>

                <div class="plinko-container">
                    <canvas id="plinko-canvas" width="350" height="400"></canvas>
                    <div class="plinko-slots">
                        <div class="plinko-slot" data-value="2">2</div>
                        <div class="plinko-slot" data-value="3">3</div>
                        <div class="plinko-slot" data-value="4">4</div>
                        <div class="plinko-slot" data-value="5">5</div>
                        <div class="plinko-slot" data-value="A">A</div>
                        <div class="plinko-slot" data-value="5">5</div>
                        <div class="plinko-slot" data-value="4">4</div>
                        <div class="plinko-slot" data-value="3">3</div>
                        <div class="plinko-slot" data-value="2">2</div>
                    </div>
                </div>

                <div class="plinko-controls">
                    <button id="drop-btn" class="drop-button" disabled>DROP BALL</button>
                    <button id="skip-plinko-btn" class="skip-button" disabled>SKIP →</button>
                </div>

                <div class="collected-cards">
                    <span>Cards: </span>
                    <div id="plinko-cards"></div>
                </div>
            </div>

            <!-- Arrow connector -->
            <div class="connector">
                <div class="arrow-down">▼</div>
                <div class="cards-earned" id="cards-earned-display">0 cards</div>
            </div>

            <!-- GAME 3: BLACKJACK -->
            <div id="blackjack-section" class="game-section">
                <div class="section-header">
                    <h2>🃏 BLACKJACK</h2>
                    <span class="section-status" id="blackjack-status">Waiting for Plinko...</span>
                </div>

                <div class="blackjack-table">
                    <div class="dealer-area">
                        <h3>Dealer <span id="dealer-score"></span></h3>
                        <div id="dealer-cards" class="cards"></div>
                    </div>

                    <div class="player-area">
                        <h3>You <span id="player-score"></span></h3>
                        <div id="player-cards" class="cards"></div>
                    </div>
                </div>

                <div class="bonus-cards-display">
                    <span>Bonus cards: </span>
                    <div id="bonus-cards"></div>
                </div>

                <div class="blackjack-controls">
                    <button id="hit-btn" class="bj-button hit" disabled>HIT</button>
                    <button id="stand-btn" class="bj-button stand" disabled>STAND</button>
                    <button id="use-bonus-btn" class="bj-button bonus" disabled>USE BONUS</button>
                </div>

                <div id="blackjack-result" class="blackjack-result"></div>
            </div>
        </div>

        <!-- Message Display -->
        <div id="message" class="message"></div>

        <!-- Play Again -->
        <div id="play-again-container" class="play-again-container hidden">
            <button id="play-again-btn" class="play-again-button">🔄 PLAY AGAIN</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
