<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triple Threat Casino</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <header>
            <h1>🎰 TRIPLE THREAT 🎲</h1>
            <div class="header-info">
                <div class="credits-display">
                    <span>$</span><span id="credits">1000</span>
                </div>
                <div class="music-controls">
                    <button id="music-toggle" class="music-btn">🔊</button>
                    <input type="range" id="volume-slider" min="0" max="100" value="50" class="volume-slider">
                </div>
                <div id="play-again-container" class="play-again-container hidden">
                    <button id="play-again-btn" class="play-again-button">🔄 AGAIN</button>
                </div>
            </div>
        </header>

        <div class="games-row">
            <!-- GAME 1: SLOTS -->
            <div id="slots-section" class="game-section active">
                <div class="section-header">
                    <span class="section-title">🎰 SLOTS</span>
                    <span class="section-status" id="slots-status">SPIN!</span>
                </div>

                <div class="slot-machine">
                    <div class="reels-container">
                        <div class="reel" id="reel1"><div class="symbols"></div></div>
                        <div class="reel" id="reel2"><div class="symbols"></div></div>
                        <div class="reel" id="reel3"><div class="symbols"></div></div>
                    </div>
                    <div class="win-line"></div>
                </div>

                <div class="controls">
                    <div class="bet-controls">
                        <button id="bet-down" class="bet-btn">-</button>
                        <span id="bet-amount" class="bet-value">10</span>
                        <button id="bet-up" class="bet-btn">+</button>
                    </div>
                    <button id="spin-btn" class="spin-button">SPIN</button>
                </div>
            </div>

            <!-- Arrow -->
            <div class="connector">
                <div class="arrow">→</div>
                <div class="earned" id="balls-earned-display">0</div>
            </div>

            <!-- GAME 2: PLINKO -->
            <div id="plinko-section" class="game-section">
                <div class="section-header">
                    <span class="section-title">🔴 PLINKO</span>
                    <span class="section-status" id="plinko-status">Wait</span>
                </div>

                <div class="plinko-container">
                    <canvas id="plinko-canvas" width="180" height="200"></canvas>
                    <div class="plinko-slots">
                        <div class="plinko-slot" data-value="2">2</div>
                        <div class="plinko-slot" data-value="3">3</div>
                        <div class="plinko-slot" data-value="4">4</div>
                        <div class="plinko-slot" data-value="A">A</div>
                        <div class="plinko-slot" data-value="4">4</div>
                        <div class="plinko-slot" data-value="3">3</div>
                        <div class="plinko-slot" data-value="2">2</div>
                    </div>
                </div>

                <div class="plinko-controls">
                    <button id="drop-btn" class="drop-button" disabled>DROP</button>
                    <button id="skip-plinko-btn" class="skip-button" disabled>→</button>
                </div>

                <div class="collected-cards">
                    <div id="plinko-cards"></div>
                </div>
            </div>

            <!-- Arrow -->
            <div class="connector">
                <div class="arrow">→</div>
                <div class="earned" id="cards-earned-display">0</div>
            </div>

            <!-- GAME 3: BLACKJACK -->
            <div id="blackjack-section" class="game-section">
                <div class="section-header">
                    <span class="section-title">🃏 BLACKJACK</span>
                    <span class="section-status" id="blackjack-status">Wait</span>
                </div>

                <div class="blackjack-table">
                    <div class="dealer-area">
                        <div class="hand-label">Dealer <span id="dealer-score"></span></div>
                        <div id="dealer-cards" class="cards"></div>
                    </div>
                    <div class="player-area">
                        <div class="hand-label">You <span id="player-score"></span></div>
                        <div id="player-cards" class="cards"></div>
                    </div>
                </div>

                <div class="bonus-cards-area">
                    <div id="bonus-cards"></div>
                </div>

                <div class="blackjack-controls">
                    <button id="hit-btn" class="bj-btn" disabled>HIT</button>
                    <button id="stand-btn" class="bj-btn" disabled>STAND</button>
                    <button id="use-bonus-btn" class="bj-btn bonus" disabled>+</button>
                </div>

                <div id="blackjack-result" class="blackjack-result"></div>
            </div>
        </div>

        <div id="message" class="message"></div>
    </div>

    <script src="game.js"></script>
</body>
</html>
