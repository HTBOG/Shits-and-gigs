<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Slots</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <header>
            <h1>🎰 LUCKY SLOTS 🎰</h1>
            <div class="credits-display">
                <span>Credits:</span>
                <span id="credits">1000</span>
            </div>
        </header>

        <div class="slot-machine">
            <div class="machine-frame">
                <div class="reels-container">
                    <div class="reel" id="reel1">
                        <div class="symbols"></div>
                    </div>
                    <div class="reel" id="reel2">
                        <div class="symbols"></div>
                    </div>
                    <div class="reel" id="reel3">
                        <div class="symbols"></div>
                    </div>
                </div>
                <div class="win-line"></div>
            </div>
        </div>

        <div class="controls">
            <div class="bet-controls">
                <button id="bet-down" class="bet-btn">-</button>
                <div class="bet-display">
                    <span>BET:</span>
                    <span id="bet-amount">10</span>
                </div>
                <button id="bet-up" class="bet-btn">+</button>
            </div>
            <button id="spin-btn" class="spin-button">SPIN</button>
            <button id="max-bet-btn" class="max-bet-button">MAX BET</button>
        </div>

        <div id="message" class="message"></div>

        <div class="paytable">
            <h3>Paytable</h3>
            <div class="paytable-items">
                <div class="pay-item"><span>💎💎💎</span><span>x100</span></div>
                <div class="pay-item"><span>7️⃣7️⃣7️⃣</span><span>x50</span></div>
                <div class="pay-item"><span>🍒🍒🍒</span><span>x25</span></div>
                <div class="pay-item"><span>🍋🍋🍋</span><span>x15</span></div>
                <div class="pay-item"><span>🍊🍊🍊</span><span>x10</span></div>
                <div class="pay-item"><span>🍇🍇🍇</span><span>x5</span></div>
                <div class="pay-item"><span>🍒🍒❓</span><span>x2</span></div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
